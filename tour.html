<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Tour virtual — Faculdade UniCPO</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d2b28;
        overflow: hidden;
        font-family: -apple-system, "Segoe UI", Inter, sans-serif;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        padding-top: max(14px, env(safe-area-inset-top));
        background: linear-gradient(180deg, rgba(8, 16, 15, 0.75) 0%, rgba(8, 16, 15, 0) 100%);
        pointer-events: none;
      }
      .bar * { pointer-events: auto; }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .brand img { height: 22px; width: auto; }
      .close {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12.5px;
        font-weight: 600;
        text-decoration: none;
        backdrop-filter: blur(6px);
      }
      .close:active { background: rgba(255, 255, 255, 0.22); }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="brand">
        <img src="images/logo-unicpo-white.png" alt="UniCPO" />
        Tour virtual
      </span>
      <a class="close" href="./" aria-label="Volver a la página principal">✕ Cerrar</a>
    </div>

    <iframe
      id="tour-embedded"
      title="UniCPO - Clínica"
      src="https://tour.panoee.net/iframe/tourclinicaunicpo?embedFullscreen=1&embedVr=1&embedGyro=1"
      allow="autoplay; accelerometer; gyroscope; fullscreen; xr-spatial-tracking"
      loading="eager"
      allowfullscreen
    ></iframe>

    <script>
      // Relays device-motion events to the embedded Panoee tour so gyro control
      // works on mobile — same handshake as Panoee's own embed snippet.
      (function () {
        var id = "tour-embedded";
        var origin = "https://tour.panoee.net";
        var ready = false;

        function pick(source, keys) {
          if (!source) return null;
          var out = {};
          keys.forEach(function (key) {
            out[key] = typeof source[key] === "number" ? source[key] : null;
          });
          return out;
        }

        function markReady(frame) {
          try {
            var href = frame.contentWindow.location.href;
            if (href && href !== "about:blank") ready = true;
          } catch (e) {
            ready = true;
          }
        }

        function send(payload) {
          var el = document.getElementById(id);
          if (!el || !el.contentWindow) return;
          try {
            el.contentWindow.postMessage(payload, origin);
          } catch (e) {}
        }

        var frame = document.getElementById(id);
        if (frame) {
          frame.addEventListener("load", function () {
            ready = true;
          });
          markReady(frame);
        }

        window.addEventListener(
          "devicemotion",
          function (e) {
            if (!ready) return;
            send({
              type: "devicemotion",
              deviceMotionEvent: {
                acceleration: pick(e.acceleration, ["x", "y", "z"]),
                accelerationIncludingGravity: pick(e.accelerationIncludingGravity, ["x", "y", "z"]),
                rotationRate: pick(e.rotationRate, ["alpha", "beta", "gamma"]),
                interval: typeof e.interval === "number" ? e.interval : 0,
                timeStamp: e.timeStamp,
              },
            });
          },
          { passive: true }
        );
      })();
    </script>
  </body>
</html>
